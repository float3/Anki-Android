name: Sync upstream AnkiDroid

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require the sync token
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
            echo "::error::Set UPSTREAM_SYNC_TOKEN: a fine-grained token for this repository with Contents, Pull requests and Workflows read and write. GITHUB_TOKEN cannot push upstream's workflow changes, and pull requests it opens start no CI."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Fast-forward main to upstream
        run: |
          git fetch --no-tags https://github.com/ankidroid/Anki-Android.git main:refs/remotes/upstream/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/upstream/main; then
            echo "::error::main has commits that are not upstream's. It must stay a mirror of ankidroid/Anki-Android main."
            exit 1
          fi
          git push origin refs/remotes/upstream/main:refs/heads/main

      - name: Open a pull request from main into ankiquest
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          git fetch --no-tags origin ankiquest:refs/remotes/origin/ankiquest
          behind=$(git rev-list --count refs/remotes/origin/ankiquest..refs/remotes/upstream/main)
          if [ "$behind" -eq 0 ]; then
            echo "ankiquest already contains every upstream commit"
            exit 0
          fi
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --base ankiquest --head main --state open --json number --jq '.[].number')
          if [ -n "$open" ]; then
            echo "Pull request #$open is open and now includes the new commits"
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base ankiquest --head main \
            --title "Merge upstream AnkiDroid" \
            --body "$behind new commits from ankidroid/Anki-Android main.

          Merge with a merge commit, never squash or rebase, so ankiquest keeps upstream's history.

          If this conflicts, merge main into a branch from ankiquest, resolve there, and merge that branch instead. Never commit to main: it mirrors upstream."
