name: ankiquest signing key rotation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/ankiquest-signing-lineage.bin
      - .github/workflows/ankiquest_signing.yml
  push:
    branches: [ankiquest]
    paths:
      - tools/ankiquest-signing-lineage.bin
      - .github/workflows/ankiquest_signing.yml

permissions:
  contents: read

jobs:
  upgrade:
    name: Upgrade and rollback on API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 34]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Sign the latest release both ways
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANKIQUEST_KEYSTORE: ${{ secrets.ANKIQUEST_KEYSTORE }}
          ANKIQUEST_KEY_PASSWORD: ${{ secrets.ANKIQUEST_KEY_PASSWORD }}
        run: |
          test -n "$ANKIQUEST_KEYSTORE" || { echo "::error::ANKIQUEST_KEYSTORE is not set"; exit 1; }
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --output base.apk
          echo "$ANKIQUEST_KEYSTORE" | base64 -d > "$RUNNER_TEMP/ankiquest.jks"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          cp base.apk old.apk
          "$apksigner" sign --ks tools/fallback-release-keystore.jks --ks-key-alias my-key --ks-pass pass:Test@123 old.apk
          cp base.apk rotated.apk
          "$apksigner" sign \
            --ks tools/fallback-release-keystore.jks --ks-key-alias my-key --ks-pass pass:Test@123 \
            --next-signer --ks "$RUNNER_TEMP/ankiquest.jks" --ks-key-alias ankiquest --ks-pass env:ANKIQUEST_KEY_PASSWORD \
            --lineage tools/ankiquest-signing-lineage.bin --rotation-min-sdk-version 28 \
            rotated.apk
          rm -f "$RUNNER_TEMP/ankiquest.jks"

      - name: An install on the public key upgrades, and cannot be taken back with it
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install old.apk
            adb install -r rotated.apk
            ! adb install -r old.apk
