name: ankiquest APK

on:
  push:
    branches: [ankiquest]
    tags: ["quest-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "jetbrains"
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Release number
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/quest-* ]]; then
            number="${GITHUB_REF#refs/tags/quest-}"
            [[ "$number" =~ ^[0-9]+$ ]] || { echo "::error::tag must be quest-<number>"; exit 1; }
          else
            number=0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Assemble
        run: |
          echo "fatal_warnings=false" >> local.properties
          ./gradlew :AnkiDroid:assembleFullRelease -Duniversal-apk=true \
            -PcustomSuffix=quest -PcustomName="AnkiDroid Quest" \
            -PankiquestRelease=${{ steps.release.outputs.number }}
          cp AnkiDroid/build/outputs/apk/full/release/*universal*.apk AnkiDroid-Quest.apk

      - name: Sign with the AnkiQuest release key
        env:
          ANKIQUEST_KEYSTORE: ${{ secrets.ANKIQUEST_KEYSTORE }}
          ANKIQUEST_KEY_PASSWORD: ${{ secrets.ANKIQUEST_KEY_PASSWORD }}
        run: |
          if [ -z "$ANKIQUEST_KEYSTORE" ]; then
            if [[ "$GITHUB_REF" == refs/tags/quest-* ]]; then
              echo "::error::ANKIQUEST_KEYSTORE is required to sign a release"
              exit 1
            fi
            echo "::warning::No ANKIQUEST_KEYSTORE; this build stays on the public fallback key"
            exit 0
          fi
          echo "$ANKIQUEST_KEYSTORE" | base64 -d > "$RUNNER_TEMP/ankiquest.jks"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" sign \
            --ks tools/fallback-release-keystore.jks --ks-key-alias my-key --ks-pass pass:Test@123 \
            --next-signer --ks "$RUNNER_TEMP/ankiquest.jks" --ks-key-alias ankiquest --ks-pass env:ANKIQUEST_KEY_PASSWORD \
            --lineage tools/ankiquest-signing-lineage.bin --rotation-min-sdk-version 28 \
            AnkiDroid-Quest.apk
          rm -f "$RUNNER_TEMP/ankiquest.jks"
          "$apksigner" verify --min-sdk-version 28 --print-certs AnkiDroid-Quest.apk | grep -q "CN=AnkiQuest"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ankidroid-quest
          path: AnkiDroid-Quest.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/quest-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" AnkiDroid-Quest.apk \
            --title "AnkiDroid Quest ${{ steps.release.outputs.number }}" \
            --notes-file .github/ankiquest-release.md
